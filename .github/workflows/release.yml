# Builds xisf2png for Windows, macOS (universal Intel + Apple Silicon) and
# Linux, and attaches the binaries to a GitHub Release.
#
# Triggered by pushing a tag like `v0.2.0`. Can also be run manually from the
# Actions tab ("Run workflow") to check that all targets still build; in that
# case the binaries are available as workflow artifacts but no release is made.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            # musl = fully static binary, runs on any distro regardless of glibc version.
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            # Native ARM64 runner (free for public repos), so no cross-linker is needed.
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-universal
            os: macos-latest
            # Pseudo-target: both Apple targets are built and merged with lipo below.
            target: universal-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Build
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p target/${{ matrix.target }}/release
          lipo -create -output target/${{ matrix.target }}/release/xisf2png \
            target/x86_64-apple-darwin/release/xisf2png \
            target/aarch64-apple-darwin/release/xisf2png
          lipo -info target/${{ matrix.target }}/release/xisf2png

      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/xisf2png --help

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "xisf2png-${{ matrix.name }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/xisf2png.exe", README.md -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="xisf2png-${{ matrix.name }}.tar.gz"
          tar -czf "$asset" \
            -C "target/${{ matrix.target }}/release" xisf2png \
            -C "$GITHUB_WORKSPACE" README.md
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

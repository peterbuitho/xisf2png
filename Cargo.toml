[package]
name = "xisf2png"
version = "0.4.0"
edition = "2021"
description = "Convert XISF and FITS astronomical images to PNG, 4K-resized and stamped with the object name"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "xisf2png"
path = "src/main.rs"

[[bin]]
name = "xisf2png-gui"
path = "src/bin/gui/main.rs"

[dependencies]
roxmltree = "0.20"
base64 = "0.22"
hex = "0.4"
flate2 = "1"
lz4_flex = "0.11"
ruzstd = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "common-controls-v6"] }
ureq = "3"

# Windows only: registry access for the Explorer context-menu entry (no
# reg.exe child process), and version-info + icon resources for the .exe files.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
